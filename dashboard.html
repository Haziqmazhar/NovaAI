<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Nova Dashboard</title>
<style>
  :root {
    --root-bg: #14161c;
    --card-bg: #1c1f27;
    --card-border: #2e3340;
    --title-fg: #8f97ab;
    --primary-fg: #e6e8ee;
    --muted-fg: #7d8394;
    --accent: #8a2be2;
    --accent-hover: #7222c9;
    --entry-bg: #262a35;
    --state-idle: #9aa0ad;
    --state-listening: #4aa3ff;
    --state-executing: #2ecc71;
    --state-error: #e74c3c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--root-bg); color: var(--primary-fg);
    font-family: "Segoe UI", sans-serif; overflow: hidden; user-select: none;
  }

  /* ---- 20 : 70 : 10 shell ---- */
  .app-shell { display: grid; grid-template-columns: 20% 70% 10%; height: 100vh; }

  /* left: page chooser */
  .sidebar-left {
    background: var(--card-bg); border-right: 1px solid var(--card-border);
    display: flex; flex-direction: column; padding: 18px 14px;
  }
  .brand { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
  .brand-sub { font-size: 11px; color: var(--muted-fg); margin: 2px 0 20px; }
  .nav-item {
    padding: 10px 12px; font-size: 13px; border-radius: 8px; margin-bottom: 4px;
    color: var(--muted-fg); border-left: 3px solid transparent; cursor: default;
  }
  .nav-item.active { background: #262b38; color: var(--primary-fg); border-left-color: var(--accent); font-weight: 600; }
  .nav-item.disabled { opacity: 0.4; }
  .nav-item.disabled .soon { font-size: 9px; margin-left: 6px; }

  /* center: workspace stage + chat */
  .workspace-center { position: relative; display: flex; flex-direction: column; padding: 18px 22px; min-width: 0; }

  /* tree arrangement: Brain centered on top, two rooms centered below it,
     boxes sized to their content instead of stretching edge to edge */
  .stage {
    flex: 0 0 auto; height: 300px; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
  }
  .connector-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .connector-layer line { stroke: #3a4152; stroke-width: 2; stroke-dasharray: 4 4; }

  .room {
    border: 2px solid var(--card-border); border-radius: 14px; position: relative;
    background: rgba(255,255,255,0.015);
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
  }
  .room-brain { width: 190px; height: 84px; flex: none; }
  .room-row { display: flex; gap: 22px; justify-content: center; }
  .room-app, .room-doc { width: 160px; height: 118px; flex: none; }
  .room-label {
    position: absolute; top: 8px; left: 12px; font-size: 10px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase;
  }

  /* robots: real inline SVG, positioned + scaled via CSS transform (not
     canvas) so motion is GPU-composited and can layer arc + overshoot +
     idle hover + per-room scale */
  #robot-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .robot { position: absolute; will-change: transform; }
  .robot svg { display: block; overflow: visible; }
  .robot-name { text-align: center; font-size: 10px; font-weight: 700; margin-top: 2px; letter-spacing: 0.3px; }
  @keyframes eyePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .robot .eye { animation: eyePulse 3.4s infinite ease-in-out; }
  @keyframes ringPulse { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.08); } }
  .robot .thruster-ring { animation: ringPulse 2.3s infinite ease-in-out; transform-origin: 100px 205px; }

  #chat-log {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    overflow-y: auto; padding: 16px 4px 110px; gap: 8px;
  }
  .chat-bubble {
    max-width: 78%; padding: 8px 14px; border-radius: 14px; font-size: 13px;
    line-height: 1.45; word-break: break-word;
  }
  .chat-bubble.user {
    align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px;
  }
  .chat-bubble.agent {
    align-self: flex-start; background: var(--card-bg); border: 1px solid var(--card-border);
    color: var(--primary-fg); border-bottom-left-radius: 4px;
  }

  /* floating search / chat bar, anchored to the center column */
  .floating-bar {
    position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%);
    width: min(88%, 560px); background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 999px; box-shadow: 0 12px 34px rgba(0,0,0,0.45);
    display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 20px;
  }
  #cmd-input {
    flex: 1; background: transparent; color: var(--primary-fg); border: none;
    outline: none; font-size: 14px;
  }
  #cmd-input::placeholder { color: var(--muted-fg); }
  #send-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 999px;
    width: 34px; height: 34px; cursor: pointer; font-size: 15px; transition: background 0.15s ease;
    display:flex; align-items:center; justify-content:center;
  }
  #send-btn:hover { background: var(--accent-hover); }

  /* right: agent task column (narrow, 10%) */
  .sidebar-right {
    background: var(--card-bg); border-left: 1px solid var(--card-border);
    padding: 16px 10px; display: flex; flex-direction: column; min-height: 0;
  }
  .status-block { margin-bottom: 14px; }
  .status-block .status { font-size: 12px; font-weight: 700; color: var(--state-idle); }
  .status-block .mode { font-size: 10px; color: var(--muted-fg); margin-top: 2px; }
  .section-title {
    font-size: 10px; font-weight: 700; color: var(--title-fg); letter-spacing: 0.5px; margin-bottom: 8px;
  }
  #task-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .task-card {
    background: #20242e; border-radius: 8px; padding: 6px 8px; border-left: 3px solid var(--state-idle);
    opacity: 0; transform: translateY(-6px); transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .task-card.visible { opacity: 1; transform: translateY(0); }
  .task-card .task-agent { font-size: 10px; font-weight: 700; color: var(--title-fg); }
  .task-card .task-detail { font-size: 11px; margin: 2px 0; word-break: break-word; }
  .task-card .task-status { font-size: 9px; text-transform: uppercase; letter-spacing: 0.4px; }
  .task-card.status-running { border-left-color: var(--state-listening); }
  .task-card.status-running .task-status { color: var(--state-listening); }
  .task-card.status-done { border-left-color: var(--state-executing); }
  .task-card.status-done .task-status { color: var(--state-executing); }
  .task-card.status-error { border-left-color: var(--state-error); }
  .task-card.status-error .task-status { color: var(--state-error); }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #3a4152; border-radius: 4px; }
</style>
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar-left">
      <div class="brand" id="brand-name">NOVA</div>
      <div class="brand-sub">agent dashboard</div>
      <div class="nav-item active">Workspace</div>
      <div class="nav-item disabled">History <span class="soon">soon</span></div>
      <div class="nav-item disabled">Settings <span class="soon">soon</span></div>
    </nav>

    <main class="workspace-center">
      <div class="stage" id="stage">
        <svg class="connector-layer" id="connector-layer">
          <line id="line-app_agent"></line>
          <line id="line-document_agent"></line>
        </svg>
        <div class="room room-brain" id="room-brain"><div class="room-label">Brain</div></div>
        <div class="room-row">
          <div class="room room-app" id="room-app_agent"><div class="room-label">App Agent</div></div>
          <div class="room room-doc" id="room-document_agent"><div class="room-label">Document Agent</div></div>
        </div>
        <div id="robot-layer"></div>
      </div>
      <div id="chat-log"></div>
      <div class="floating-bar">
        <input id="cmd-input" type="text" placeholder="Ask Nova or type a command...">
        <button id="send-btn" title="Send">➤</button>
      </div>
    </main>

    <aside class="sidebar-right">
      <div class="status-block">
        <div class="status" id="status-text">idle</div>
        <div class="mode" id="mode-text"></div>
      </div>
      <div class="section-title">TASKS</div>
      <div id="task-list"></div>
    </aside>
  </div>

<script>
  const ROLE_COLOR = { brain: "#b46bff", app_agent: "#4aa3ff", document_agent: "#3ddc84" };

  const agentLabel = {};   // agent_id -> display label
  const agentAnim = {};    // agent_id -> {offsetX, offsetY, tilt, scale, busy, travelling, hoverPhase}
  const roomCenters = {};  // agent_id -> [x, y] relative to #stage
  const taskCards = {};    // agent_id -> currently-active task-card div

  function hexToRgba(hex, alpha) {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // ---- line-art robot, adapted from a reference design: stroke-only
  // body (no fill), recolored per role; eyes stay as small solid glowing
  // dots for expression, everything else is outline. ----
  function robotSVG(color, agentId) {
    const gid = "glow-" + agentId;
    return `
    <svg viewBox="0 0 200 260" width="86" height="112" overflow="visible">
      <defs>
        <filter id="${gid}" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="0" stdDeviation="3.2" flood-color="${color}" flood-opacity="0.85"/>
        </filter>
      </defs>
      <g fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#${gid})">
        <ellipse cx="100" cy="238" rx="32" ry="6" stroke-opacity="0.3"/>
        <ellipse class="thruster-ring" cx="100" cy="205" rx="24" ry="7"/>
        <path d="M 87 170 L 113 170 L 107 196 L 93 196 Z"/>
        <path d="M 72 100 C 72 80, 128 80, 128 100 C 128 124, 122 140, 100 140 C 78 140, 72 124, 72 100 Z"/>
        <circle cx="100" cy="118" r="9"/>
        <polygon points="100,113 105,121 95,121"/>
        <rect x="92" y="76" width="16" height="10" rx="3"/>
        <line x1="100" y1="30" x2="100" y2="10"/>
        <circle cx="100" cy="22" r="6"/>
        <path d="M 90 18 Q 100 10 110 18" stroke-opacity="0.6"/>
        <rect x="60" y="34" width="80" height="50" rx="24"/>
        <rect x="69" y="43" width="62" height="32" rx="16"/>
        <ellipse class="eye" cx="86" cy="59" rx="6" ry="8" fill="${color}" stroke="none"/>
        <ellipse class="eye" cx="114" cy="59" rx="6" ry="8" fill="${color}" stroke="none"/>
        <circle cx="45" cy="108" r="10"/>
        <circle cx="155" cy="108" r="10"/>
        <path d="M 22 100 Q 16 108 22 116" stroke-opacity="0.7"/>
        <path d="M 178 100 Q 184 108 178 116" stroke-opacity="0.7"/>
      </g>
    </svg>`;
  }

  function initAgents(agentsList) {
    const layer = document.getElementById("robot-layer");
    layer.innerHTML = "";
    for (const [id, label] of agentsList) {
      const color = ROLE_COLOR[id] || "#8a2be2";
      agentLabel[id] = label;
      agentAnim[id] = {
        offsetX: 0, offsetY: 0, tilt: 0, scale: 1, busy: false, travelling: false,
        hoverPhase: Math.random() * 10,
      };

      const roomLabel = document.querySelector(`#room-${id} .room-label`);
      if (roomLabel) roomLabel.style.color = color;
      setRoomGlow(id, 0); // idle: agent color at low intensity, no glow

      const wrap = document.createElement("div");
      wrap.className = "robot";
      wrap.id = "robot-" + id;
      wrap.innerHTML = robotSVG(color, id) +
        `<div class="robot-name" style="color:${color}">${label}</div>`;
      layer.appendChild(wrap);
    }
    requestAnimationFrame(() => { refreshStageLayout(); });
  }

  function refreshStageLayout() {
    const stage = document.getElementById("stage");
    const stageRect = stage.getBoundingClientRect();

    for (const id of Object.keys(agentAnim)) {
      const room = document.getElementById("room-" + id);
      const robotEl = document.getElementById("robot-" + id);
      if (!room || !robotEl) continue;
      const r = room.getBoundingClientRect();
      const cx = r.left - stageRect.left + r.width / 2;
      const cy = r.top - stageRect.top + r.height / 2;
      roomCenters[id] = [cx, cy];
      robotEl.style.left = cx + "px";
      robotEl.style.top = cy + "px";

      // scale the robot to fit this room's own dimensions
      const naturalH = 112, labelH = 16;
      const targetH = Math.max(24, r.height - labelH) * 0.82;
      agentAnim[id].scale = Math.max(0.35, Math.min(1.2, targetH / naturalH));
    }

    // tree connector lines: Brain's bottom-center to each sub-room's top-center
    const brainRoom = document.getElementById("room-brain");
    if (brainRoom) {
      const br = brainRoom.getBoundingClientRect();
      const bx = br.left - stageRect.left + br.width / 2;
      const by = br.top - stageRect.top + br.height;
      for (const subId of ["app_agent", "document_agent"]) {
        const room = document.getElementById("room-" + subId);
        const line = document.getElementById("line-" + subId);
        if (!room || !line) continue;
        const r = room.getBoundingClientRect();
        const sx = r.left - stageRect.left + r.width / 2;
        const sy = r.top - stageRect.top;
        line.setAttribute("x1", bx); line.setAttribute("y1", by);
        line.setAttribute("x2", sx); line.setAttribute("y2", sy);
      }
    }
  }
  window.addEventListener("resize", refreshStageLayout);

  function setHeader(agentName, brainMode) {
    document.getElementById("brand-name").textContent = agentName.toUpperCase();
    const modeEl = document.getElementById("mode-text");
    modeEl.textContent = brainMode ? "● " + brainMode : "";
    modeEl.style.color = brainMode.toLowerCase().startsWith("claude") ? "var(--state-executing)" : "var(--muted-fg)";
  }

  function setInputVisible(visible) {
    document.querySelector(".floating-bar").style.display = visible ? "flex" : "none";
  }

  function setStatus(state, detail) {
    const el = document.getElementById("status-text");
    const STATUS_COLORS = {
      idle: "var(--state-idle)", listening: "var(--state-listening)",
      executing: "var(--state-executing)", error: "var(--state-error)",
    };
    el.textContent = detail ? `${state} (${detail})` : state;
    el.style.color = STATUS_COLORS[state] || "var(--muted-fg)";
  }

  function appendLog(text) {
    const log = document.getElementById("chat-log");
    const bubble = document.createElement("div");
    const isUser = text.startsWith("You:");
    bubble.className = "chat-bubble " + (isUser ? "user" : "agent");
    bubble.textContent = text;
    log.appendChild(bubble);
    log.scrollTop = log.scrollHeight;
  }

  function addTaskCard(agentId, detail) {
    const list = document.getElementById("task-list");
    const card = document.createElement("div");
    card.className = "task-card status-running";
    card.innerHTML = `<div class="task-agent">${agentLabel[agentId]}</div>` +
                      `<div class="task-detail"></div><div class="task-status">running</div>`;
    card.querySelector(".task-detail").textContent = detail;
    list.insertBefore(card, list.firstChild);
    taskCards[agentId] = card;
    requestAnimationFrame(() => card.classList.add("visible"));
    while (list.children.length > 10) list.removeChild(list.lastChild);
  }

  function updateTaskCard(agentId, status) {
    const card = taskCards[agentId];
    if (!card) return;
    card.className = "task-card visible status-" + status;
    card.querySelector(".task-status").textContent = status;
    delete taskCards[agentId];
  }

  // ---- room glow: always the agent's OWN color — idle is that color at
  // low alpha (so every room has a persistent colored identity even at
  // rest, per spec), active is the same color at full intensity with a
  // glow. Done/error outcome is still shown distinctly on the task card
  // in the sidebar, so nothing is lost by not re-hueing the room. ----
  function setRoomGlow(agentId, intensity) {
    const room = document.getElementById("room-" + agentId);
    const color = ROLE_COLOR[agentId];
    if (!room || !color) return;
    const idleAlpha = 0.55;
    const borderAlpha = idleAlpha + (1 - idleAlpha) * intensity;
    room.style.borderColor = hexToRgba(color, borderAlpha);
    room.style.boxShadow = intensity > 0
      ? `0 0 ${16 * intensity + 6}px ${3 * intensity + 1}px ${hexToRgba(color, 0.55 * intensity)}`
      : "none";
  }

  // ---- travel animation: arc trajectory + ease-out-back overshoot/settle
  // + a directional lean, layered under a continuous idle hover in tick()
  // below — the combination is what reads as "alive" rather than a flat
  // linear slide from A to B. ----
  function easeOutBack(t) {
    const c1 = 1.25, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function animateOffset(agentId, tx, ty, duration, onDone) {
    const anim = agentAnim[agentId];
    const sx = anim.offsetX, sy = anim.offsetY;
    const dx = tx - sx, dy = ty - sy;
    const dist = Math.hypot(dx, dy);
    const arcHeight = Math.min(30, dist * 0.22);
    const dir = dx >= 0 ? 1 : -1;
    const start = performance.now();
    function step(now) {
      const raw = Math.min(1, (now - start) / duration);
      const eased = easeOutBack(raw);
      const arcT = Math.min(1, raw);
      anim.offsetX = sx + dx * eased;
      anim.offsetY = sy + dy * eased - Math.sin(arcT * Math.PI) * arcHeight;
      anim.tilt = dir * Math.sin(arcT * Math.PI) * 9;
      if (raw < 1) {
        requestAnimationFrame(step);
      } else {
        anim.tilt = 0;
        if (onDone) onDone();
      }
    }
    requestAnimationFrame(step);
  }

  function startTravel(agentId) {
    const anim = agentAnim[agentId];
    if (anim.travelling) return; // sequential architecture today, but stay safe regardless
    anim.travelling = true;
    const [bx, by] = roomCenters.brain;
    const [hx, hy] = roomCenters[agentId];
    animateOffset(agentId, bx - hx, by - hy, 560, () => {
      setTimeout(() => {
        animateOffset(agentId, 0, 0, 560, () => { anim.travelling = false; });
      }, 260);
    });
  }

  function applyAgentEvent(event) {
    const { agent: id, status, detail } = event;
    const anim = agentAnim[id];
    if (!anim) return;

    if (status === "thinking" || status === "running") {
      anim.busy = true;
      setRoomGlow(id, 1);
      if (id !== "brain") {
        startTravel(id);
        addTaskCard(id, detail);
        appendLog(`${agentLabel[id]}: ${detail}...`);
      }
    } else {
      anim.busy = false;
      if (status === "done" || status === "error") {
        setRoomGlow(id, 1);
        setTimeout(() => setRoomGlow(id, 0), 900);
        if (id !== "brain") updateTaskCard(id, status);
      } else {
        setRoomGlow(id, 0);
      }
    }
  }

  // ---- continuous idle hover, always running regardless of busy state,
  // composited with the travel offset and per-room scale via CSS
  // transform each frame ----
  function tick() {
    for (const id of Object.keys(agentAnim)) {
      const anim = agentAnim[id];
      anim.hoverPhase += anim.busy ? 0.03 : 0.018;
      const hoverAmplitude = anim.busy ? 7 : 4.5;
      const hoverBob = Math.sin(anim.hoverPhase) * hoverAmplitude;
      const el = document.getElementById("robot-" + id);
      if (el) {
        el.style.transform =
          `translate(-50%, -50%) translate(${anim.offsetX}px, ${anim.offsetY + hoverBob}px) ` +
          `rotate(${anim.tilt}deg) scale(${anim.scale})`;
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---- input handling ----
  function submitCommand() {
    const input = document.getElementById("cmd-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    if (window.pywebview && window.pywebview.api) {
      window.pywebview.api.submit_command(text);
    }
  }
  document.getElementById("send-btn").addEventListener("click", submitCommand);
  document.getElementById("cmd-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitCommand();
  });
</script>
</body>
</html>
